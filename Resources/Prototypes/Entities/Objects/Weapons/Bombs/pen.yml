# Pen Clicking was stopping it from activating like a grenade

- type: entity
  name: pen
  parent: BaseItem
  id: PenNoClick
  description: 'A dark ink pen.'
  suffix: NoClick
  components:
  - type: Tag
    tags:
    - Write
    - Pen
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    state: pen
  - type: Item
    sprite: Objects/Misc/bureaucracy.rsi
    heldPrefix: pen
    size: Tiny
  - type: PhysicalComposition
    materialComposition:
      Steel: 25
  # Shitmed Change
  - type: Tending
    speed: 0.55
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/hemostat1.ogg
  - type: EmbeddableProjectile
    offset: 0.3,0.0
    removalTime: 0.0
  - type: ThrowingAngle
    angle: 315
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 3

- type: entity
  parent: PenNoClick
  id: PenEmbeddableNoClick
  abstract: true
  suffix: NoClick
  components:
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 5

- type: entity
  name: pen
  suffix: Exploding
  parent: PenEmbeddableNoClick
  description: A dark ink pen.
  id: PenExploding
  components:
  - type: OnUseTimerTrigger
    delay: 4
    examinable: false
  - type: Explosive
    explosionType: Default
    maxIntensity: 8
    intensitySlope: 5
    totalIntensity: 20
    canCreateVacuum: false
  - type: ActivateOnPaperOpened
  - type: ExplodeOnTrigger
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger

- type: entity
  parent: BaseItem
  id: PenExplodingBox
  name: exploding pen box
  description: A small box containing an exploding pen. Packaging disintegrates when opened, leaving no evidence behind.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Storage/penbox.rsi
    state: exploding_pen
  - type: SpawnItemsOnUse
    items:
    - id: PenExploding
    sound:
      path: /Audio/Effects/unwrap.ogg
