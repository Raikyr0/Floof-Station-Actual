- type: entity
  id: CrateArmorySMGWT550 # Floof
  parent: CrateWeaponSecure
  name: WT550 SMG crate
  description: Contains a single WT550 Submachine Gun with two mags. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: WeaponSubMachineGunWt550 # Floof
        amount: 1
      - id: MagazinePistolSubMachineGunTopMounted
        amount: 2

- type: entity
  id: CrateArmoryShotgunEnforcer # Floof
  parent: CrateWeaponSecure
  name: Enforcer shotgun crate
  description: Contains a single Enforcer Combat Shotgun, and some standard shotgun shells. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: WeaponShotgunEnforcer # Floof
        amount: 1
      - id: BoxLethalshot
        amount: 1
      - id: BoxBeanbag
        amount: 1
      - id: BoxShotgunSlug
        amount: 1

- type: entity
  id: CrateTrackingImplants
  parent: CrateWeaponSecure
  name: tracking implants
  description: Contains a handful of tracking implanters. Good for prisoners you'd like to release but still keep track of.
  components:
  - type: StorageFill
    contents:
      - id: TrackingImplanter
        amount: 5

- type: entity
  parent: CrateWeaponSecure
  id: CrateTrainingBombs
  name: training bombs
  description: Contains three low-yield training bombs for security to learn defusal and safe ordnance disposal, EOD suit not included. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
    - id: TrainingBomb
      amount: 3

- type: entity
  id: CrateArmoryLaserRifle # Floof
  parent: CrateWeaponSecure
  name: laser rifle crate
  description: Contains three standard-issue laser rifles. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: WeaponLaserCarbineEmpty # Floof - Laser Rifles arrive uncharged
        amount: 3

- type: entity
  id: CrateArmoryPistolsMK58 # Floof
  parent: CrateWeaponSecure
  name: MK58 pistols crate
  description: Contains two MK58 pistols with four mags. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
    - id: WeaponPistolMk58
      amount: 2
    - id: MagazinePistol
      amount: 4
