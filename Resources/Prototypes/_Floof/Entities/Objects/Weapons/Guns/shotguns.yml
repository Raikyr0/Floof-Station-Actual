- type: entity
  name: excommunicant sawn off
  parent: BaseWeaponShotgun
  id: WeaponShotgunSawnExcommunicant
  description: An over/under sawn off shotgun featuring an Ivory pearl handle and a silver barrel to clean the souls of the wicked. Produced by SESWC!
  components:
  - type: BallisticAmmoProvider
    capacity: 2
    proto: ShellSoulbreaker
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: Sprite
    sprite: _Floof/Objects/Weapons/Gun/excommunicant.rsi  #floof
  - type: Clothing
    sprite: _Floof/Objects/Weapons/Gun/excommunicant.rsi #floof
  - type: Item
    size: Small
    sprite: _Floof/Objects/Weapons/Gun/excommunicant_64x.rsi #floof
  - type: Gun
    fireRate: 1
    fireOnDropChance: 0.5

