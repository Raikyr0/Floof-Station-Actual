- type: body
  id: XenosQueen
  name: XenosQueen
  root: torso
  slots:
    torso:
      part: TorsoMonkey
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        lungs: OrganSpaceAnimalLungs # Immunity to airloss
        stomach: OrganAnimalStomach
        liver: OrganAnimalLiver
        heart: OrganGoliathHeart # Immunity to cold
        kidneys: OrganAnimalKidneys
    right arm:
      part: RightArmMonkey
      connections:
      - right hand
    left arm:
      part: LeftArmMonkey
      connections:
      - left hand
    right hand:
      part: RightHandMonkey
    left hand:
      part: LeftHandMonkey
    right leg:
      part: RightLegMonkey
      connections:
      - right foot
    left leg:
      part: LeftLegMonkey
      connections:
      - left foot
    right foot:
      part: RightFootMonkey
    left foot:
      part: LeftFootMonkey
